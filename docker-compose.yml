services:
  backend:
    build: ./shopping-backend
    ports:
      - "8081:8080"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=root
      - DB_PASSWORD=secretpassword
      - DB_NAME=shopping_db
      - DB_SSLMODE=disable
    volumes:
      - ./shopping-backend:/app
    depends_on:
      - postgres-db

  frontend:
    build: ./shopping-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./shopping-frontend:/app
      - /app/node_modules

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: shopping_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: